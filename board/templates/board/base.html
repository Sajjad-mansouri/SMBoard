{%load static%}
<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMBoards</title>
    <link rel="stylesheet" type="text/css" href="{%static 'board/base/css/style.css'%}">

    {%block style%}
    {%endblock%}
</head>
<body>

            <header id="header">
                <div class="header-left">
                    <span class="brand-logo" id="brand-logo-btn">📋 SMBoard</span>
                </div>
                <div class="header-center">
                    <div class="search-wrapper">
                        <input type="text" id="search-input" placeholder="🔍 Search cards..." /><button id="search-clear-btn" class="icon-btn small hidden">✕</button>

                    <div class="search-results" id="search-results">
                        <div id="search-results-content"></div>
                    </div>

                    </div>
                    <!-- Search Results Dropdown -->

                </div>
                <div class="header-right"> 
                    <button class="profile-avatar-btn" id="profile-avatar-btn" style="background:#0079bf;" title="Account">A</button>
                </div>
            </header>
    {%block content%}

    {%endblock%}
    <!-- Profile Dropdown (floating) -->
    <div id="profile-dropdown" class="profile-dropdown hidden">
        <div class="profile-dropdown-header">
            <div class="account-title">ACCOUNT</div>
            <div class="profile-row">
                <div class="profile-avatar-lg" id="profile-avatar-lg" style="background:#0079bf;"></div>
                <div class="profile-info">
                    <span class="profile-name" id="profile-name-display"></span>
                    <span class="profile-email" id="profile-email-display"></span>
                </div>
            </div>
        </div>
        <div class="profile-dropdown-item" id="profile-settings-btn">⚙️ Settings</div>
        <div class="profile-dropdown-divider"></div>
        <div class="profile-dropdown-item" id="profile-logout-btn">🚪 Logout</div>
    </div>
<script src="{%static 'authentication/js/auth.js'%}"></script>
<script src="{%static 'board/base/js/script.js'%}"></script>


{%block script%}
{%endblock%}

</body>
</html>
