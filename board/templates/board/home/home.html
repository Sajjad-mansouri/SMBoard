{%load static%}
<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMBoards</title>
<link rel="stylesheet" type="text/css" href="{%static 'board/home/css/style.css'%}">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <!-- Brand -->
        <div class="header-left">
            <div class="brand-logo">
                <span>📋</span> SMBoard
            </div>
        </div>

        <!-- Search -->
        <div class="header-center">
            <div class="search-wrapper">
                <span>🔍</span>
                <input type="text" placeholder="Search boards and cards..." id="search-input">
                <button class="search-clear-btn" id="search-clear-btn">✕</button>
            </div>
            
            <!-- Search Results Dropdown -->
            <div class="search-results" id="search-results">
                <div id="search-results-content"></div>
            </div>
        </div>

        <!-- Profile Avatar -->
        <div class="header-right">

            
            <div class="profile-avatar-wrapper">
                <button class="user-avatar" id="user-avatar-btn" title="John Doe">JD</button>
                
                <!-- Profile Dropdown -->
                <div class="profile-dropdown" id="profile-dropdown">
                    <div class="profile-dropdown-header">
                        <div class="account-title">ACCOUNT</div>
                        <div class="profile-row">
                            <div class="profile-avatar-lg" style="background:#0079bf;">JD</div>
                            <div class="profile-info">
                                <span class="profile-name">John Doe</span>
                                <span class="profile-email">john@example.com</span>
                            </div>
                        </div>
                    </div>
                    <div class="profile-dropdown-item" id="profile-settings-btn">⚙️ Settings</div>
                    <div class="profile-dropdown-divider"></div>
                    <div class="profile-dropdown-item" id="profile-logout-btn">🚪 Logout</div>
                </div>
            </div>
        </div>
    </header>

    <!-- Content Area -->
    <div class="content-area">
        <!-- Your Workspaces -->
        <section class="workspace-section">
            <div class="section-header">
                <h2 class="section-title">
                    <span class="section-icon">👤</span>
                    Your Workspaces
                </h2>
                <button class="btn btn-primary" id="create-board-btn">+ Create New Board</button>
            </div>
            <div class="boards-grid" id="your-boards">
                <!-- Your boards will be rendered here -->
            </div>
            <div class="empty-state hidden" id="your-boards-empty">
                <div class="empty-state-icon">📋</div>
                <div class="empty-state-text">No boards yet</div>
                <div class="empty-state-subtext">Create your first board to get started!</div>
            </div>
        </section>

        <!-- Guest Workspaces -->
        <section class="workspace-section">
            <div class="section-header">
                <h2 class="section-title">
                    <span class="section-icon">👥</span>
                    Guest Workspaces
                </h2>
            </div>
            <div class="boards-grid" id="guest-boards">
                <!-- Guest boards will be rendered here -->
            </div>
            <div class="empty-state hidden" id="guest-boards-empty">
                <div class="empty-state-icon">🤝</div>
                <div class="empty-state-text">No guest boards</div>
                <div class="empty-state-subtext">Boards you're invited to will appear here</div>
            </div>
        </section>
    </div>

    <!-- Create Board Modal -->
    <div class="modal-overlay" id="create-board-modal">
        <div class="modal">
            <div class="modal-header">
                <h3 class="modal-title">Create New Board</h3>
                <button class="modal-close" id="close-modal">✕</button>
            </div>
            <div class="form-group">
                <label class="form-label">Board Name</label>
                <input type="text" class="form-input" id="board-name-input" placeholder="Enter board name..." maxlength="50">
            </div>
            <div class="form-group">
                <label class="form-label">Background Color</label>
                <div class="color-picker" id="color-picker">
                    <div class="color-option selected" data-color="#0079bf" style="background: #0079bf;"></div>
                    <div class="color-option" data-color="#eb5a46" style="background: #eb5a46;"></div>
                    <div class="color-option" data-color="#61bd4f" style="background: #61bd4f;"></div>
                    <div class="color-option" data-color="#f2d600" style="background: #f2d600;"></div>
                    <div class="color-option" data-color="#ff9f1a" style="background: #ff9f1a;"></div>
                    <div class="color-option" data-color="#c377e0" style="background: #c377e0;"></div>
                    <div class="color-option" data-color="#344563" style="background: #344563;"></div>
                    <div class="color-option" data-color="#00b8d9" style="background: #00b8d9;"></div>
                </div>
            </div>
            <div class="modal-actions">
                <button class="btn btn-secondary" id="cancel-create">Cancel</button>
                <button class="btn btn-primary" id="confirm-create">Create Board</button>
            </div>
        </div>
    </div>

<script type="text/javascript" src="{%static 'board/home/js/script.js'%}"></script>
</body>
</html>
