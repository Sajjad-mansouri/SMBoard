<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SMBoard • Forgot Password</title>

<style>
    * { margin:0; padding:0; box-sizing:border-box; font-family:"Inter", sans-serif; }

    body {
        background:#f5f7fb;
        height:100vh;
        display:flex;
        justify-content:center;
        align-items:center;
    }

    .container {
        background:#fff;
        padding:40px 32px;
        border-radius:14px;
        box-shadow:0 8px 24px rgba(0,0,0,0.08);
        max-width:420px;
        width:90%;
    }

    h1 {
        font-size:24px;
        margin-bottom:8px;
        text-align:center;
        color:#222;
    }

    p {
        margin-bottom:22px;
        font-size:15px;
        text-align:center;
        line-height:1.6;
        color:#444;
    }

    label {
        font-size:14px;
        font-weight:600;
        margin-bottom:6px;
        display:block;
        color:#333;
    }

    input[type="email"] {
        width:100%;
        padding:12px 14px;
        font-size:15px;
        border-radius:8px;
        border:1px solid #ccd2e0;
        margin-bottom:18px;
        transition:0.25s;
    }

    input[type="email"]:focus {
        border-color:#3d7fff;
        box-shadow:0 0 0 3px rgba(61,127,255,0.15);
        outline:none;
    }

    button {
        width:100%;
        padding:12px;
        font-size:16px;
        border:none;
        border-radius:8px;
        background:#3d7fff;
        color:#fff;
        cursor:pointer;
        transition:0.2s;
        font-weight:600;
    }

    button:hover {
        background:#2f6feb;
    }



    /* Alert Box */
    .alert {
        background:#ff4d4d;
        color:#fff;
        padding:12px 14px;
        border-radius:8px;
        margin-bottom:16px;
        font-size:14px;
        opacity:0;
        transform:translateY(-10px);
        transition:0.3s ease;
    }
    .alert.show {
        opacity:1;
        transform:translateY(0);
    }

    /* SVG success icon styling */
    .icon-box {
        text-align:center;
        margin-bottom:18px;
    }

</style>
</head>
<body>

<div class="container">

    <div id="successView" >
        <div class="icon-box">
            <!-- Beautiful mail-sent SVG -->
            <svg width="80" height="80" viewBox="0 0 100 100" fill="none">
              <circle cx="50" cy="50" r="45" stroke="#3d7fff" stroke-width="6"/>
              <path d="M25 35 L50 52 L75 35" stroke="#3d7fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
              <rect x="25" y="35" width="50" height="30" rx="6" stroke="#3d7fff" stroke-width="6"/>
            </svg>
        </div>

        <h1>Check Your Inbox</h1>
        <p>
            If an account with that email exists, we’ve sent a link for you to reset your password.
            Please check your inbox.
        </p>
        <div style="text-align:center; margin-top:16px;">
            <a href="/login/" style="color:#3d7fff; text-decoration:none; font-size:14px; font-weight:500;">
                Go to Login
            </a>
        </div>
    </div>

</div>

<script>

</script>

</body>
</html>
